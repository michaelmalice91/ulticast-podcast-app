name: namer_app
description: "A podcast app inspired by TESD"
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  english_words: ^4.0.0
  provider: ^6.1.5
  http: ^1.5.0
  xml_map_converter: ^1.0.0+1
  html_unescape: ^2.0.0
  audio_service: ^0.18.18
  just_audio: ^0.10.5
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  intl: ^0.20.2
  crypto: ^3.0.6
  audio_session: ^0.2.2
  scrollable_positioned_list: ^0.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/data/tesd.json